#
# The calculation-method registry (E2 configuration): each authority's published
# Fajr/Isha angles and any offsets, read by ClasspathCalculationMethodAccessor.
# Mirrors the site's astronomy.js method table so the JVM and browser agree.
#
# Keys are lower-case, dot-namespaced, kebab-case (asymm convention). A method's
# incoming CamelCase id (e.g. MuslimWorldLeague, from method-defaults.json) is
# normalized to its slug (muslim-world-league) on lookup.
#
# Per method, only NON-DEFAULT fields are listed. Defaults:
#   .isha-angle    = 0        (degrees; ignored when interval > 0)
#   .isha-interval = 0        (fixed minutes after Maghrib for Isha)
#   .maghrib-angle = 0        (Shia Maghrib angle in degrees; 0 = sunset)
#   .rounding      = nearest  (nearest | up | none)
#   .<event>-offset = 0       (whole minutes; event = fajr|sunrise|dhuhr|asr|maghrib|isha)
# The madhab (Asr shadow factor) is supplied per lookup, not stored here.
#
# Unknown keys fall back to this method:
calculation-method.default = muslim-world-league

# ---- Custom-angle methods: bare parameters, no Dhuhr offset ----
