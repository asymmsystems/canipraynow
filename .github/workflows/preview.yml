name: Deploy Preview

on:
  push:
    branches:
      - develop

# Only one preview deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-preview
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Eliya JDK
        uses: ./.github/actions/setup-eliya

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # Make orchestrates the pipeline (generate the city content with the reactor, then bake
      # the JBake site); it is the single definition CI and humans share.
      - name: Build site
        run: make site

      - name: Deploy to Cloudflare Pages (preview)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy application/cipn-app-site/target/site --project-name=can-i-pray-now-code-pfw --branch=develop
