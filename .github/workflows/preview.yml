name: Deploy Preview

on:
  push:
    branches:
      - develop

# Only one preview deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-preview
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 25
          cache: maven

      - name: Build site
        run: ./mvnw -Pproduction -pl application/cipn-app-site -am clean process-resources --batch-mode --no-transfer-progress

      - name: Deploy to Cloudflare Pages (preview)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy application/cipn-app-site/target/site --project-name=can-i-pray-now-code-pfw --branch=develop
