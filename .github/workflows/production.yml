name: Deploy Production

on:
  push:
    tags:
      - '*'

# Never interrupt an in-flight production release; queue instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so we can verify the tag is on main

      # GitHub cannot scope a tag trigger to a branch, so we accept any tag
      # ('*') and verify here that the tagged commit is reachable from main.
      # Tags created off any other branch are skipped (the run stays green).
      - name: Verify tag is on main
        id: guard
        run: |
          git fetch --no-tags --quiet origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
            echo "Tag $GITHUB_REF_NAME is on main — deploying to production."
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Tag $GITHUB_REF_NAME is not on main — skipping production deploy."
          fi

      - name: Set up Eliya JDK
        if: steps.guard.outputs.on_main == 'true'
        uses: ./.github/actions/setup-eliya

      - name: Cache Maven
        if: steps.guard.outputs.on_main == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Build site
        if: steps.guard.outputs.on_main == 'true'
        run: ./mvnw -Pproduction -pl application/cipn-app-site -am clean process-resources --batch-mode --no-transfer-progress

      # Deploy the edge Worker (/go, /api) before Pages. Its routes take precedence over
      # the Pages project for those paths; if this step fails the job stops and Pages is
      # not redeployed, so production is never left in a half-updated state.
      - name: Deploy edge Worker (production)
        if: steps.guard.outputs.on_main == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: application/cipn-app-fn
          command: deploy

      - name: Deploy to Cloudflare Pages (production)
        if: steps.guard.outputs.on_main == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy application/cipn-app-site/target/site --project-name=can-i-pray-now-code-pfw --branch=main
