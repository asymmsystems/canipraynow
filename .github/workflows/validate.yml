name: Validate Build

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Eliya JDK
        uses: ./.github/actions/setup-eliya

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # Compile + run the whole reactor test suite on Eliya: the fiqh engine golden vectors and
      # hard invariants, the WASM method-table parity, the accessors, and the ArchUnit layering
      # rules. Replaces the old `node scripts/test-engine.mjs` gate (the engine is Java now, and
      # the build stays Node-free per ADR-0002). The site bake + WASM compile are exercised by the
      # preview deploy (`make site`) on the same PR.
      - name: Build and test (Eliya, no Node)
        run: make build
