name: Validate Build

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 25
          cache: maven

      - name: Build site
        run: ./mvnw -Pproduction clean process-resources --batch-mode --no-transfer-progress

      # Syntax gate for the client-side ES modules and data files, using the
      # node binary preinstalled on the runner. No npm, no package.json - the
      # build itself stays Maven-only. Full engine tests: TASK-C0001.
      - name: Check JS syntax and JSON validity
        run: |
          set -e
          find src/main/jbake/assets/js functions -name '*.js' -print0 \
            | xargs -0 -n1 sh -c 'node --input-type=module --check < "$1" || { echo "SYNTAX: $1"; exit 1; }' _
          find src/main/jbake/assets/data src/main/jbake/assets/js/strings -name '*.json' -print0 \
            | xargs -0 -n1 node -e 'JSON.parse(require("fs").readFileSync(process.argv[1]))'

      # Fiqh engine golden-matrix + hard-invariant suite. Gates every PR: a
      # rule-data change that breaks a cell or invariant 1 fails here. Needs
      # only the runner's node (no npm).
      - name: Run fiqh engine tests
        run: node scripts/test-engine.mjs
